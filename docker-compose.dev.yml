services:
  # Redis service
  redis:
    image: redis:7-alpine
    container_name: autovideoclip-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Main application service (development mode)
  autovideoclip-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: autovideoclip:dev
    container_name: autovideoclip-app-dev
    restart: unless-stopped
    ports:
      - "8000:8000"  # Backend API
      - "3000:3000"  # Frontend UI
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - frontend_dev_modules:/app/frontend/node_modules
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/autovideoclip.db
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      # Forward LLM settings from the host .env / shell (Compose automatically reads the root .env for variable substitution).
      # Without this section, API_DASHSCOPE_API_KEY entered as described in DOCKER.md never reaches the container.
      - LLM_PROVIDER=${LLM_PROVIDER:-dashscope}
      - API_MODEL_NAME=${API_MODEL_NAME:-qwen-plus}
      - API_DASHSCOPE_API_KEY=${API_DASHSCOPE_API_KEY:-}
      - API_OPENAI_API_KEY=${API_OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-}
      - API_GEMINI_API_KEY=${API_GEMINI_API_KEY:-}
      - API_SILICONFLOW_API_KEY=${API_SILICONFLOW_API_KEY:-}
      - AUTOVIDEOCLIP_YT_SUBTITLE_LANGS=${AUTOVIDEOCLIP_YT_SUBTITLE_LANGS:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Celery worker service (development mode)
  celery-worker-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: autovideoclip:dev
    container_name: autovideoclip-celery-worker-dev
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/autovideoclip.db
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      # Forward LLM settings from the host .env / shell (Compose automatically reads the root .env for variable substitution).
      # Without this section, API_DASHSCOPE_API_KEY entered as described in DOCKER.md never reaches the container.
      - LLM_PROVIDER=${LLM_PROVIDER:-dashscope}
      - API_MODEL_NAME=${API_MODEL_NAME:-qwen-plus}
      - API_DASHSCOPE_API_KEY=${API_DASHSCOPE_API_KEY:-}
      - API_OPENAI_API_KEY=${API_OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-}
      - API_GEMINI_API_KEY=${API_GEMINI_API_KEY:-}
      - API_SILICONFLOW_API_KEY=${API_SILICONFLOW_API_KEY:-}
      - AUTOVIDEOCLIP_YT_SUBTITLE_LANGS=${AUTOVIDEOCLIP_YT_SUBTITLE_LANGS:-}
    command: ["celery", "-A", "backend.core.celery_app", "worker", "--loglevel=debug", "--concurrency=1", "-Q", "celery,processing,video,notification,upload"]
    depends_on:
      redis:
        condition: service_healthy
      autovideoclip-dev:
        condition: service_healthy

volumes:
  frontend_dev_modules:
  redis_dev_data:
    driver: local

networks:
  default:
    name: autovideoclip-dev-network
