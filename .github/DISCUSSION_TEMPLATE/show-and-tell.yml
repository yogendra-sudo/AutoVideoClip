title: "Share a finished clip:"
body:
  - type: markdown
    attributes:
      value: |
        Made a great clip with AutoClip? Share it here. Maintainers may feature selected clips in the [website gallery](https://zhouxiaoka.github.io/autoclip_intro/cases/) with credit.
        Eligibility: generated by AutoClip and not edited in other software (changing titles or templates in AutoClip is fine); the source is public; and you have permission to publish the finished clip.
  - type: input
    id: source
    attributes:
      label: Source video link
      placeholder: "https://www.youtube.com/watch?v=… or a Bilibili link"
    validations:
      required: true
  - type: checkboxes
    id: platforms
    attributes:
      label: Published platforms
      options:
        - label: Douyin
        - label: Xiaohongshu
        - label: Bilibili
        - label: TikTok
        - label: Instagram Reels
        - label: YouTube Shorts
        - label: YouTube
  - type: textarea
    id: clips
    attributes:
      label: Finished clip
      description: Attach the finished MP4 or an accessible link. If you have a publishing package, include the cover and post copy.
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Version and model
      placeholder: "For example: v1.5.0 · qwen-plus · macOS"
    validations:
      required: true
  - type: input
    id: run
    attributes:
      label: Time and cost (optional)
      placeholder: "For example: 1h20m source, 9 minutes to render, about ¥0.1 in model costs"
  - type: checkboxes
    id: consent
    attributes:
      label: Permission
      options:
        - label: I allow AutoClip to feature these clips on the website and README with credit linking to my GitHub
          required: true
