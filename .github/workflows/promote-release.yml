# Release in two stages: a tag triggers desktop-build.yml to create a pre-release
# (in-app updates cannot access it). After device smoke tests and the observation
# period pass, run this workflow to promote it. If a release is faulty, halt it
# to return in-app updates to the previous good version. See RELEASE_CHECKLIST.md.
name: Promote / Halt Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.4.1"
        required: true
        type: string
      action:
        description: "promote = publish to all users; halt = withdraw the release and point in-app updates to fallback_tag"
        required: true
        type: choice
        options: [promote, halt]
      fallback_tag:
        description: "For halt, the latest good version to restore, e.g. v1.4.0 (ignored for promote)"
        required: false
        type: string
      acceptance_run_id:
        description: "Required for promote: a passing Release Acceptance run ID (ignored for halt)"
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-promotion
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      FALLBACK: ${{ inputs.fallback_tag }}
      ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
      WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require verified acceptance before promotion
        if: inputs.action == 'promote'
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          assert re.fullmatch(r'v\d+\.\d+\.\d+', os.environ['TAG']), 'invalid tag'
          assert re.fullmatch(r'[1-9]\d*', os.environ['ACCEPTANCE_RUN_ID']), 'promote requires a Release Acceptance run ID'
          PY
          gh api "repos/$GH_REPO/actions/runs/$ACCEPTANCE_RUN_ID" > acceptance-run.json
          python - <<'PY'
          import json
          run = json.load(open('acceptance-run.json'))
          assert run['path'] == '.github/workflows/release-acceptance.yml', 'wrong evidence workflow'
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'acceptance did not pass'
          PY
          gh run download "$ACCEPTANCE_RUN_ID" --name release-acceptance --dir accepted
          BUILD_RUN_ID=$(python - <<'PY'
          import json
          value = json.load(open('accepted/acceptance.json'))['build_run_id']
          assert type(value) is int and value > 0, 'invalid build run ID'
          print(value)
          PY
          )
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          TARGET_COMMIT=$(git rev-parse "$TAG^{commit}")
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > build-run.json
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID/jobs?per_page=100" > build-jobs.json
          gh release download "$TAG" --dir release-assets
          python scripts/release_acceptance.py source-commits --manifest accepted/acceptance.json > evidence-source-commits.txt
          while IFS= read -r source; do
            git fetch --no-tags origin "$source"
          done < evidence-source-commits.txt
          python scripts/release_acceptance.py validate --tag "$TAG" --commit "$TARGET_COMMIT" \
            --assets release-assets --manifest accepted/acceptance.json --repository "$GH_REPO" \
            --build-run build-run.json --build-jobs build-jobs.json
      - name: Check release assets
        run: |
          set -e
          assets=$(gh release view "$TAG" --json assets -q '.assets[].name')
          echo "$assets"
          if [ "${{ inputs.action }}" = "promote" ]; then
            echo "$assets" | grep -q '^latest.json$' || { echo "::error::$TAG is missing latest.json, required for in-app updates"; exit 1; }
            echo "$assets" | grep -q '\.dmg$' || { echo "::error::$TAG is missing the macOS DMG"; exit 1; }
            echo "$assets" | grep -q 'setup\.exe$' || { echo "::error::$TAG is missing the Windows installer"; exit 1; }
          fi

      - name: Promote
        if: inputs.action == 'promote'
        run: |
          gh release edit "$TAG" --prerelease=false --latest
          echo "$TAG promoted: releases/latest/download/latest.json now points to this release" >> "$GITHUB_STEP_SUMMARY"

      - name: Halt
        if: inputs.action == 'halt'
        run: |
          set -e
          [ -n "$FALLBACK" ] || { echo "::error::halt requires fallback_tag"; exit 1; }
          gh release view "$FALLBACK" --json assets -q '.assets[].name' | grep -q '^latest.json$' \
            || { echo "::error::$FALLBACK has no latest.json and cannot be used as a fallback"; exit 1; }
          gh release edit "$FALLBACK" --prerelease=false --latest
          gh release edit "$TAG" --prerelease=true
          {
            echo "$TAG was withdrawn as a pre-release; in-app updates now point to $FALLBACK."
            echo "Users who already upgraded to $TAG will not be downgraded. Ship a patch release as soon as possible."
          } >> "$GITHUB_STEP_SUMMARY"

      # Notify the website repository to update its version and download links
      # (autoclip_intro/.github/workflows/sync-release.yml). If WEBSITE_DISPATCH_TOKEN
      # is not set, skip this step; the website's daily cron will catch up.
      # See scripts/website/README.md.
      - name: Notify website (repository_dispatch)
        if: env.WEBSITE_DISPATCH_TOKEN != ''
        run: |
          current="$TAG"; [ "${{ inputs.action }}" = "halt" ] && current="$FALLBACK"
          curl -sS -f -X POST \
            -H "Authorization: Bearer $WEBSITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/zhouxiaoka/autoclip_intro/dispatches \
            -d "{\"event_type\":\"autoclip-release\",\"client_payload\":{\"tag\":\"$current\"}}"
          echo "Notified the website to sync to $current"
