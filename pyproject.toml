[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoclip-mcp"
version = "1.5.8"
description = "AutoVideoClip — AI long-video auto-clipping: CLI and MCP server entry point"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# The autoclip-mcp distribution name lets `uvx autoclip-mcp` install this package and run its matching entry point.
# These pins match runtime dependencies in requirements.txt; pytest remains only in requirements.txt.
# The desktop app, Docker, and CI still install requirements.txt.
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "starlette==1.6.0",
  "python-multipart==0.0.32",
  "websockets==16.1.1",
  "aiofiles==25.1.0",
  "sqlalchemy==2.0.52",
  "alembic==1.19.2",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "celery[redis]==5.6.3",
  "redis==6.4.0",
  "requests==2.34.2",
  "aiohttp==3.14.3",
  "python-jose[cryptography]==3.5.0",
  "passlib[bcrypt]==1.7.4",
  "cryptography==50.0.1",
  "qrcode[pil]==8.2",
  "Pillow==11.3.0",
  "yt-dlp[default]==2026.8.19",
  "pysrt==1.1.2",
  "psutil==7.2.2",
  "pytz==2026.3.post1",
  "openai==3.8.0",
  "google-genai==2.22.0",
  "dashscope==1.27.4",
  "mcp==2.1.1",
  "sentry-sdk==2.69.2",
]

[project.scripts]
autoclip = "backend.cli:main"
autoclip-mcp = "backend.mcp_server:main"
autovideoclip = "backend.cli:main"
autovideoclip-mcp = "backend.mcp_server:main"

[project.urls]
Homepage = "https://github.com/yogendra-sudo/AutoVideoClip"
Issues = "https://github.com/yogendra-sudo/AutoVideoClip/issues"

[tool.setuptools.packages.find]
include = ["backend", "backend.*"]
exclude = ["backend.tests", "backend.tests.*"]

[tool.setuptools.package-data]
backend = ["prompt/*.txt", "prompt/**/*.txt", "prompts/*.srt", "assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/fonts/*.json", "assets/models/*.onnx", "assets/models/*-LICENSE.txt", "assets/lexicon/*.txt.gz", "assets/lexicon/*-LICENSE.txt", "assets/outro/*.mp4", "assets/templates/*/*", "core/infistar_models.json", "core/event_catalog.json", "core/failure_messages.json", "presets/*.json"]
