services:
  # Redis service
  redis:
    image: redis:7-alpine
    container_name: autovideoclip-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Main application service
  autovideoclip:
    build:
      context: .
      dockerfile: Dockerfile
    # All four services share one image; using the same image name builds it only once.
    image: autovideoclip:local
    container_name: autovideoclip-app
    restart: unless-stopped
    ports:
      - "8000:8000"  # Backend API
      - "3000:3000"  # Frontend UI
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/autovideoclip.db
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      # Forward LLM settings from the host .env / shell (Compose automatically reads the root .env for variable substitution).
      # Without this section, API_DASHSCOPE_API_KEY entered as described in DOCKER.md never reaches the container.
      - LLM_PROVIDER=${LLM_PROVIDER:-dashscope}
      - API_MODEL_NAME=${API_MODEL_NAME:-qwen-plus}
      - API_DASHSCOPE_API_KEY=${API_DASHSCOPE_API_KEY:-}
      - API_OPENAI_API_KEY=${API_OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-}
      - API_GEMINI_API_KEY=${API_GEMINI_API_KEY:-}
      - API_SILICONFLOW_API_KEY=${API_SILICONFLOW_API_KEY:-}
      - UPLOAD_POST_API_KEY=${UPLOAD_POST_API_KEY:-}
      - AUTOVIDEOCLIP_ALLOWED_ORIGINS=${AUTOVIDEOCLIP_ALLOWED_ORIGINS:-}
      - UPLOAD_POST_USER=${UPLOAD_POST_USER:-}
      - AUTOVIDEOCLIP_YT_SUBTITLE_LANGS=${AUTOVIDEOCLIP_YT_SUBTITLE_LANGS:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery worker service
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: autovideoclip:local
    container_name: autovideoclip-celery-worker
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/autovideoclip.db
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      # Forward LLM settings from the host .env / shell (Compose automatically reads the root .env for variable substitution).
      # Without this section, API_DASHSCOPE_API_KEY entered as described in DOCKER.md never reaches the container.
      - LLM_PROVIDER=${LLM_PROVIDER:-dashscope}
      - API_MODEL_NAME=${API_MODEL_NAME:-qwen-plus}
      - API_DASHSCOPE_API_KEY=${API_DASHSCOPE_API_KEY:-}
      - API_OPENAI_API_KEY=${API_OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-}
      - API_GEMINI_API_KEY=${API_GEMINI_API_KEY:-}
      - API_SILICONFLOW_API_KEY=${API_SILICONFLOW_API_KEY:-}
      - UPLOAD_POST_API_KEY=${UPLOAD_POST_API_KEY:-}
      - UPLOAD_POST_USER=${UPLOAD_POST_USER:-}
      - AUTOVIDEOCLIP_YT_SUBTITLE_LANGS=${AUTOVIDEOCLIP_YT_SUBTITLE_LANGS:-}
    # celery_app.task_routes sends tasks to dedicated queues; a worker without -Q consumes only the default
    # `celery` queue, leaving pipeline tasks in `processing` indefinitely.
    command: celery -A backend.core.celery_app worker --loglevel=info --concurrency=2 -Q celery,processing,video,notification,upload
    depends_on:
      redis:
        condition: service_healthy
      autovideoclip:
        condition: service_healthy

  # Celery Beat scheduler
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: autovideoclip:local
    container_name: autovideoclip-celery-beat
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/autovideoclip.db
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
    command: celery -A backend.core.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      autovideoclip:
        condition: service_healthy

  # Flower monitoring service (optional)
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    image: autovideoclip:local
    container_name: autovideoclip-flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/autovideoclip.db
      - ENVIRONMENT=production
    command: celery -A backend.core.celery_app flower --port=5555
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started

volumes:
  redis_data:
    driver: local

networks:
  default:
    name: autovideoclip-network
